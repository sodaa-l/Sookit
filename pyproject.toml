[project]
name = "sookit"
version = "260905.2"
description = "Sookit - 一个 Windows 桌面音视频工具箱"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "pyqt6-fluent-widgets>=1.11.2",
    "certifi>=2024.0.0",
]

[project.scripts]
sookit = "sookit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sookit"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
]
