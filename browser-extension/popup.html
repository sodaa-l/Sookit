<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Sookit</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <img class="logo" src="icons/sookit-48.png" alt="">
  <div class="titles">
    <h1>Sookit</h1>
    <p class="caption">浏览器扩展</p>
  </div>
  <span id="status" class="status" data-state="probing" role="status" aria-live="polite">
    <span class="dot"></span><span class="spinner"></span><span id="status-text">连接中…</span>
  </span>
</header>

<section class="card">
  <label class="row" for="toggle-youtube">
    <span class="row-text">
      <span class="row-title">YouTube 页面按钮</span>
      <span class="row-desc">在视频操作栏显示 Sookit</span>
    </span>
    <span class="switch">
      <input id="toggle-youtube" type="checkbox">
      <span class="track"></span>
    </span>
  </label>
  <label class="row" for="toggle-x">
    <span class="row-text">
      <span class="row-title">X 帖子按钮</span>
      <span class="row-desc">在视频帖的 Grok 按钮左侧显示</span>
    </span>
    <span class="switch">
      <input id="toggle-x" type="checkbox">
      <span class="track"></span>
    </span>
  </label>
</section>

<section class="card">
  <div class="row">
    <span class="row-text">
      <span class="row-title">桌面端接收</span>
      <span class="row-desc">设置页「浏览器扩展调用」总闸</span>
    </span>
    <span id="master-value" class="value">—</span>
  </div>
</section>

<button id="primary" class="primary" type="button">启动 Sookit</button>
<script src="popup.js"></script>
</body>
</html>
